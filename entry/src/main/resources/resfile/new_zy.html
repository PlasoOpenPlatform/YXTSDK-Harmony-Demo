<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta content="width=device-width, initial-scale=1.0,minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
          name="viewport">


    <style>
        * {
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #F2F4F7;
        }

        p {
            color: #999;
        }

        .errorImg {
            width: 80%;
            max-width: 400px;
        }

        #btn_reload {
            width: 120px;
            height: 40px;
            background: #fff;
            border-radius: 4px;
            border: 1px solid #DCE0DF;
            margin: 10px auto;
            font-size: 20px;
            display: block;
            color: #006E5B;
            cursor: pointer;
        }

        .contain {
            position: absolute;
            width: 80px;
            height: 80px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
        }

        .animate {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: -25%;
            border-radius: 10%;
            z-index: 1;
            transform: translateZ(0);
            background: #8EEFC7;
            animation: animate .6s -.1s linear infinite;
        }
      .loadGif{
        display: none;
        position: absolute;
        top: -25%;
        left: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        transform: translateZ(0);
      }
        .shadow {
            display: none;
            position: absolute;
            left: 0;
            width: 100%;
            bottom: -9%;
            height: 10%;
            background: #DFE6EC;
            border-radius: 50%;
            -webkit-animation: shadow .6s -.1s linear infinite;
            -moz-animation: shadow .6s -.1s linear infinite;
            -o-animation: shadow .6s -.1s linear infinite;
            animation: shadow .6s -.1s linear infinite;
        }

        @keyframes animate {
            17% {
                border-bottom-right-radius: 10%;
            }

            25% {
                transform: translateY(25%) rotate(22.5deg);
            }

            50% {
                border-bottom-right-radius: 100%;
                transform: translateY(50%) scale(1, .9) rotate(45deg);
            }

            75% {
                transform: translateY(25%) rotate(67.5deg);
            }

            100% {
                transform: translateY(0) rotate(90deg);
            }
        }

        @keyframes shadow {
            50% {
                transform: scale(1.25, 1);
            }
        }


    </style>

    <title></title>
</head>

<body>
<div id="react_body" onClick="fixIosCaptureBug()">
    <div class="contain" id="loading">
        <div class="animate"></div>
        <img class="loadGif"/>
        <div class="shadow"></div>
    </div>
</div>
</body>

</html>
